<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Discovery</title>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="page">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
            <i data-lucide="chevron-left"></i>
        </button>
        <aside class="sidebar">
            <ul>
                <li>
                <a href="index.html" class="nav-link">
                    <i data-lucide="home"></i>
                </a>
                </li>
                <li>
                <a href="favorites.html" class="nav-link">
                    <i data-lucide="heart"></i>
                </a>
                </li>
                <li>
                <a href="recommendations.html" class="nav-link">
                    <i data-lucide="sparkles"></i>
                </a>
                </li>
            </ul>
            <a href="/auth/login/google" id="sidebar-signin" class="sidebar-signin" title="Sign in">
                <i data-lucide="log-in"></i>
            </a>
        </aside>

        <main class="gallery-container">
            <header class="page-header">
                <input type="text" id="search-input" placeholder="Search or describe what you want..." />
            </header>
            <div class="gallery">
                <div class="gutter-sizer"></div>
            </div>
            <div id="scroll-trigger" style="height: 50px;"></div>
        </main>
    </div>

    <div id="image-modal" class="modal">
        <span class="close-btn">&times;</span>
        <div class="modal-card">
            <img class="modal-content" id="modal-image">
            <div id="modal-details">
                <p id="modal-artist"></p>
                <button id="modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
